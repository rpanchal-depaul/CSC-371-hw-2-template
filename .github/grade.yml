name: HW2

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  run:
    name: Grade all HW 2 Assignments
    runs-on: macos-13

    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Bundle Install
        run: bundle install
      
      - name: HW2
        env:
          scheme: ${{ 'default' }}
          platform: ${{ 'iOS Simulator' }}
        run: ruby grader.rb -d "./HW2" -a "HW2" -s "HW2Lib" -t "platform=macOS"

      - name: 'Upload Artifact HW2'
        uses: actions/upload-artifact@v4
        with:
          name: HW2_Results.csv
          path: HW2_Results.csv
          retention-days: 10